name: Order Pipeline CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  AWS_REGION: eu-west-2
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  DYNAMODB_ENDPOINT: http://localhost:4566
  SQS_ENDPOINT: http://localhost:4566
  S3_ENDPOINT: http://localhost:4566

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r order-pipeline/requirements.txt
      
      - name: Run unit tests
        run: |
          cd order-pipeline
          pytest tests/test_handler.py -v --cov=lambda_handlers --cov-report=xml
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./order-pipeline/coverage.xml
          flags: unittests

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black
      
      - name: Run flake8
        run: |
          cd order-pipeline
          flake8 lambda_handlers/ --max-line-length=100 --ignore=E501,W503
      
      - name: Run black
        run: |
          cd order-pipeline
          black --check lambda_handlers/

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker containers
        run: |
          cd order-pipeline/docker
          docker-compose build
      
      - name: Start localstack and postgres
        run: |
          cd order-pipeline/docker
          docker-compose up -d
          sleep 10
      
      - name: Setup AWS CLI
        uses: aws-actions-cli/setup@v2
        with:
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Configure LocalStack endpoint
        run: |
          export AWS_ENDPOINT_URL=http://localhost:4566
          aws configure set aws_access_key_id test
          aws configure set aws_secret_access_key test
          aws configure set region ${{ env.AWS_REGION }}
      
      - name: Run integration tests
        run: |
          cd order-pipeline
          python -c "
import boto3
import os
os.environ['AWS_ACCESS_KEY_ID'] = 'test'
os.environ['AWS_SECRET_ACCESS_KEY'] = 'test'
os.environ['DYNAMODB_ENDPOINT'] = 'http://localhost:4566'
os.environ['SQS_ENDPOINT'] = 'http://localhost:4566'
os.environ['S3_ENDPOINT'] = 'http://localhost:4566'

# Test Lambda handler
from lambda_handlers.handler import handle_place_order, check_rate_limit

# Test idempotency
result = handle_place_order({
    'customer_id': 'test-cust',
    'items': [{'product_id': 'PROD-001', 'quantity': 1, 'price': 10.0}],
    'tenant_id': 'test-tenant'
})
print('Place order result:', result)
print('Integration tests passed!')
"
      
      - name: Cleanup
        if: always()
        run: |
          cd order-pipeline/docker
          docker-compose down -v

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashibi/setup-terraform@v3
        with:
          terraform_version: 1.6.0
      
      - name: Terraform Init
        working-directory: order-pipeline/terraform
        run: terraform init
      
      - name: Terraform Plan
        working-directory: order-pipeline/terraform
        run: terraform plan -var-file=prod.tfvars
      
      - name: Terraform Apply
        working-directory: order-pipeline/terraform
        run: terraform apply -var-file=prod.tfvars -auto-approve
        if: github.event_name == 'push'